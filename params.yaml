fetch:
  raw_dir: "data/raw"

preprocess:
  output_path: "data/preprocessed/flights.csv"
  drop_cancelled: true
  drop_diverted: true
  filter_year: 2024

train:
  test_size: 0.2
  random_state: 42
  target_col: "DepDelayMinutes"
  n_estimators: 500
  max_depth: 8
  learning_rate: 0.05
  subsample: 0.8