name: ML Pipeline

# Triggers:
#  - push na main → uporabi podatke iz DVC remote (HITRO ~10 min)
#  - workflow_dispatch z fresh_fetch=true → polni BTS download (~30 min)
#  - schedule (1. v mesecu) → polni BTS download
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'params.yaml'
      - 'dvc.yaml'
      - 'pyproject.toml'
      - 'gx/checkpoints/**'
      - 'gx/expectations/**'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:
    inputs:
      fresh_fetch:
        description: 'Fresh BTS download (POČASI ~30 min)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 0 1 * *'  # 1. v mesecu

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pipx install uv

      - name: Set up DVC
        uses: iterative/setup-dvc@v1

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Install Python dependencies
        run: |
          uv sync --frozen

      - name: Configure DVC remote (DagsHub)
        run: |
          uv run dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          uv run dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}

      - name: Pull data from DVC remote
        run: |
          uv run dvc pull --force
        continue-on-error: false

      # =====================================================
      # FRESH FETCH MODE: poženi celoten pipeline preko DVC
      # =====================================================
      - name: Run full pipeline (fresh fetch)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.fresh_fetch == 'true')
        run: |
          uv run dvc repro

      # =====================================================
      # NORMAL MODE: direktno zažene skripte (BREZ fetch)
      # =====================================================
      - name: Run preprocessing
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.fresh_fetch != 'true')
        run: |
          uv run python src/data/preprocess_data.py

      - name: Run data validation (Great Expectations)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.fresh_fetch != 'true')
        run: |
          cd gx && uv run python run_checkpoint.py

      - name: Run drift detection (Evidently)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.fresh_fetch != 'true')
        run: |
          uv run python src/data/test_data.py

      - name: Run model training
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.fresh_fetch != 'true')
        run: |
          uv run python src/model/train.py

      - name: Run review sentiment analysis
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.fresh_fetch != 'true')
        run: |
          uv run python src/reviews/batch_predict.py

      # =====================================================
      # PUSH RESULTS
      # =====================================================
      - name: Push data and models to DVC remote
        run: |
          uv run dvc push

      - name: Commit dvc.lock if changed
        run: |
          if [[ -n $(git status -s dvc.lock) ]]; then
            git add dvc.lock
            git commit -m "ci: update dvc.lock from automated run"
            git push
          else
            echo "Ni sprememb v dvc.lock"
          fi
        continue-on-error: true

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-reports
          path: |
            reports/
          retention-days: 30