name: ML Pipeline

# Triggers:
#  - push na main → uporabi podatke iz DVC remote
#  - schedule (1. v mesecu) → fresh BTS download
#  - workflow_dispatch → ročna sprožitev
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'params.yaml'
      - 'dvc.yaml'
      - 'pyproject.toml'
      - 'gx/checkpoints/**'
      - 'gx/expectations/**'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:
    inputs:
      fresh_fetch:
        description: 'Force fresh BTS download (počasi)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 0 1 * *'  # 1. v mesecu - fresh fetch (po BTS objavah)

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pipx install uv

      - name: Set up DVC
        uses: iterative/setup-dvc@v1

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Install Python dependencies
        run: |
          uv sync --frozen

      - name: Configure DVC remote (DagsHub)
        run: |
          uv run dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          uv run dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}

      - name: Pull existing data from DVC remote
        run: |
          uv run dvc pull --force
        continue-on-error: false

      # Pri push triggerju: NE poganjamo fetch (uporabljamo obstoječe podatke iz DagsHub)
      # Pri schedule/manual fresh_fetch: poženemo celoten pipeline z fetch
      - name: Run DVC pipeline (without fetch)
        if: github.event_name == 'push'
        run: |
          # Skip fetch stage - uporabljamo cached _combined.csv iz dvc pull
          uv run dvc repro preprocess
          uv run dvc repro validate
          uv run dvc repro test_data
          uv run dvc repro train
          uv run dvc repro analyze_reviews

      - name: Run DVC pipeline (with fresh fetch)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.fresh_fetch == 'true')
        run: |
          # Polni pipeline z BTS fetch
          uv run dvc repro

      - name: Run DVC pipeline (default for manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.fresh_fetch != 'true'
        run: |
          uv run dvc repro preprocess
          uv run dvc repro validate
          uv run dvc repro test_data
          uv run dvc repro train
          uv run dvc repro analyze_reviews

      - name: Push data and models to DVC remote
        run: |
          uv run dvc push

      - name: Commit and push DVC lock changes
        run: |
          if [[ -n $(git status -s dvc.lock) ]]; then
            git add dvc.lock
            git commit -m "ci: update dvc.lock from automated pipeline run"
            git push
          else
            echo "Ni sprememb v dvc.lock"
          fi

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-reports
          path: |
            reports/
          retention-days: 30